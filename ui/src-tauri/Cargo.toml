[package]
name = "m590-ui"
version = "0.1.0"
description = "M590Bridge desktop shell (Tauri)"
authors = ["M590Bridge"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "m590_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
m590-daemon = { path = "../../crates/m590-daemon" }
rfd = "0.15"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
