[package]
name = "m590-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "M590Bridge background service binary and embeddable hub"

[features]
default = []
task-057-diagnostics = ["m590-clipboard/task-057-diagnostics"]

[lib]
name = "m590_daemon"
path = "src/lib.rs"

[[bin]]
name = "m590-daemon"
path = "src/main.rs"

[dependencies]
m590-core = { workspace = true }
m590-clipboard = { workspace = true }
m590-net = { workspace = true }
base64 = "0.22"
getrandom = "0.3"
mdns-sd = { version = "0.20", default-features = false, features = ["logging"] }
serde_json = "1.0"

[target.'cfg(target_os = "linux")'.dependencies]
# Keep the Linux prototype on fuser's pure-Rust mount path; libfuse development
# packages are not required for building the daemon.
fuser = { version = "0.18", default-features = false }
